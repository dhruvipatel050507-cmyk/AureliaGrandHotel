<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Manage Events</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body { margin:0; font-family:'Inter',sans-serif; background:#F4F6F9; }
.container { padding:30px; }

h2 { margin-bottom:20px; }

/* FORM */
.form-box {
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    display:grid;
    gap:10px;
}

input, textarea, select {
    padding:10px;
    border-radius:6px;
    border:1px solid #ddd;
}

/* BUTTONS */
.btn { padding:6px 12px; border:none; border-radius:6px; cursor:pointer; }
.btn-primary { background:#2E4F4F; color:white; }
.btn-danger { background:#e74c3c; color:white; }
.btn-edit { background:#3498db; color:white; }
.btn-save { background:#27ae60; color:white; }

/* SEARCH */
.search {
    width:300px;
    margin-bottom:20px;
}

/* GRID */
.event-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.event-card {
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.05);
}

.event-card img {
    width:100%;
    height:160px;
    object-fit:cover;
}

.event-content { padding:15px; }

.status {
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

.available { background:#d4edda; color:#2e7d32; }
.unavailable { background:#f8d7da; color:#c0392b; }

.edit-form { display:none; margin-top:10px; }
</style>
</head>

<body>

<div th:replace="admin/fragments :: navbar"></div>

<div class="container">

<h2>Manage Events</h2>

<!-- ➕ ADD EVENT -->
<div class="form-box">
<form action="/admin/events/add" method="post" enctype="multipart/form-data">

<input type="text" name="name" placeholder="Event Name" required>

<textarea name="description" placeholder="Event Description" required></textarea>

<input type="text" name="location" placeholder="Location" required>

<input type="number" name="price" placeholder="Price" required>

<select name="status">
<option value="AVAILABLE">Available</option>
<option value="NOT_AVAILABLE">Not Available</option>
</select>

<input type="file" name="image" required>

<button class="btn btn-primary">Add Event</button>
</form>
</div>

<!-- 🔍 SEARCH -->
<input type="text" class="search" placeholder="Search events..." onkeyup="searchEvent()">

<!-- 🎉 EVENT CARDS -->
<div class="event-grid" id="eventList">

<div class="event-card" th:each="e : ${events}">

	<img th:src="@{'/uploads/events/' + ${e.image}}"
	     style="width:100%; height:160px; object-fit:cover;"
	     onerror="this.src='/images/events/default.jpg'">

<div class="event-content">

<!-- VIEW MODE -->
<div class="view-mode">

<h3 th:text="${e.name}"></h3>
<p th:text="${e.description}"></p>

<p><strong>📍</strong> <span th:text="${e.location}"></span></p>
<p><strong>💰</strong> ₹<span th:text="${e.price}"></span></p>

<p>
<span th:text="${e.status}" 
      th:classappend="${e.status == 'AVAILABLE'} ? 'status available' : 'status unavailable'">
</span>
</p>

<button class="btn btn-edit" onclick="toggleEdit(this)">Edit</button>

<a th:href="@{'/admin/events/delete/' + ${e.id}}" 
   class="btn btn-danger">Delete</a>

</div>

<!-- ✏️ EDIT MODE -->
<div class="edit-form">

<form action="/admin/events/update" method="post" enctype="multipart/form-data">

<input type="hidden" name="id" th:value="${e.id}">

<input type="text" name="name" th:value="${e.name}">
<textarea name="description" th:text="${e.description}"></textarea>

<input type="text" name="location" th:value="${e.location}">
<input type="number" name="price" th:value="${e.price}">

<select name="status">
<option th:selected="${e.status == 'AVAILABLE'}">AVAILABLE</option>
<option th:selected="${e.status == 'NOT_AVAILABLE'}">NOT_AVAILABLE</option>
</select>

<input type="file" name="image">

<button class="btn btn-save">Save</button>
<button type="button" class="btn" onclick="toggleEdit(this)">Cancel</button>

</form>

</div>

</div>
</div>

</div>

</div>

<div th:replace="admin/fragments :: footer"></div>

<script>
function searchEvent(){
    let input = document.querySelector(".search").value.toLowerCase();
    document.querySelectorAll(".event-card").forEach(card=>{
        card.style.display = card.innerText.toLowerCase().includes(input) ? "" : "none";
    });
}

function toggleEdit(btn){
    let card = btn.closest(".event-card");
    let view = card.querySelector(".view-mode");
    let edit = card.querySelector(".edit-form");

    if(edit.style.display === "block"){
        edit.style.display = "none";
        view.style.display = "block";
    } else {
        edit.style.display = "block";
        view.style.display = "none";
    }
}
</script>

</body>
</html>
