<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Booking Dashboard - Aurelia Grand</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== ROOT ===== */
:root {
    --primary:#2F5D50;
    --accent:#C7A17A;
    --bg:#F8F6F2;
    --white:#fff;
    --sub:#6B6B6B;
    --border:#E5E0DA;
}

/* ===== GLOBAL ===== */
body {
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
	margin: 0;
	    overflow-x: hidden; /* removes right blank scroll */
}

/* ===== HERO ===== */
.hero {
    height:45vh;
    background:url('/images/hero/banner1.png') center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.hero::after {
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
}

.hero h1 {
    position:relative;
    z-index:2;
    color:#f1ede7;
    font-size:48px;
    font-family:'Playfair Display';
}

/* ===== CONTAINER ===== */
.container {
    width: 95%;
    max-width: 1400px; /* increased */
    margin: auto;
    padding: 40px 0;
}

/* ===== STATS ===== */
.cards {
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.card {
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.card h3 { font-size:13px; color:var(--sub); }
.card h1 { color:var(--primary); margin-top:8px; }

/* ===== TABLE BOX ===== */
.table-box {
    width: 100%;
    background: white;
    border-radius: 12px;
    overflow-x: auto; /* important */
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* ===== TABLE ===== */
table {
    width: 100%;
    min-width: 1000px; /* prevents squeezing */
    border-collapse: collapse;
    table-layout: auto; /* IMPORTANT CHANGE */
}
th {
    background:var(--primary);
    color:white;
    font-weight:500;
}

th, td {
    padding:14px;
    text-align:left;
    vertical-align:middle;
}

/* COLUMN WIDTH FIX */
th:nth-child(1), td:nth-child(1) { width:6%; }
th:nth-child(2), td:nth-child(2) { width:14%; }
th:nth-child(3), td:nth-child(3) { width:16%; }
th:nth-child(4), td:nth-child(4) { width:16%; }
th:nth-child(5), td:nth-child(5) { width:10%; }
th:nth-child(6), td:nth-child(6) { width:12%; }
th:nth-child(7), td:nth-child(7) { width:10%; }
th:nth-child(8), td:nth-child(8) { width:16%; }

tr {
    height:70px;
}

tr:hover {
    background:#f6f9f8;
}

/* ===== STATUS ===== */
.status {
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    display:inline-block;
    min-width:90px;
    text-align:center;
}

.pending { background:#fff3cd; color:#856404; }
.confirmed { background:#d4edda; color:#2e7d32; }
.cancelled { background:#f8d7da; color:#c0392b; }

/* ===== BUTTONS ===== */
.actions {
    display:flex;
    gap:8px;
}

.btn {
    padding:6px 10px;
    border-radius:6px;
    font-size:12px;
    color:white;
    text-decoration:none;
    white-space:nowrap;
}

.approve { background:#27ae60; }
.cancel { background:#f39c12; }
.delete { background:#e74c3c; }

/* ===== EMPTY ===== */
.empty {
    text-align:center;
    padding:20px;
    color:#777;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
    .cards {
        grid-template-columns:1fr 1fr;
    }
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.cards,
.table-box {
    width: 100%;
}
</style>
</head>

<body>

<div th:replace="~{admin/fragments :: navbar}"></div>

<!-- HERO -->
<section class="hero">
    <h1>Booking Dashboard</h1>
</section>

<div class="container">

<!-- STATS -->
<div class="cards">
    <div class="card">
        <h3>Total Bookings</h3>
        <h1 th:text="${totalBookings}"></h1>
    </div>

    <div class="card">
        <h3>Pending</h3>
        <h1 th:text="${pendingBookings}"></h1>
    </div>

    <div class="card">
        <h3>Confirmed</h3>
        <h1 th:text="${approvedBookings}"></h1>
    </div>

    <div class="card">
        <h3>Revenue</h3>
        <h1>₹ <span th:text="${revenue}"></span></h1>
    </div>
</div>

<!-- TABLE -->
<div class="table-box">
<table>

<thead>
<tr>
<th>ID</th>
<th>User</th>
<th>Room</th>
<th>Dates</th>
<th>Payment</th>
<th>Total</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr th:if="${bookings == null || #lists.isEmpty(bookings)}">
    <td colspan="8" class="empty">No bookings available</td>
</tr>

<tr th:each="b : ${bookings}">

    <td th:text="${b.id}"></td>

    <td th:text="${b.user != null ? b.user.name : 'N/A'}"></td>

    <td>
        <span th:text="${b.room != null ? b.room.type : 'N/A'}"></span><br>
        <small th:text="${b.room != null ? b.room.roomNumber : ''}"></small>
    </td>

    <td>
        <span th:text="${b.checkIn != null ? #temporals.format(b.checkIn, 'dd MMM') : '-'}"></span>
        -
        <span th:text="${b.checkOut != null ? #temporals.format(b.checkOut, 'dd MMM') : '-'}"></span>
    </td>

    <td th:text="${b.paymentStatus}"></td>

    <td>₹ <span th:text="${b.totalPrice}"></span></td>

    <td>
        <span th:text="${b.status}"
              th:class="'status ' + ${b.status != null ? b.status.toLowerCase() : ''}">
        </span>
    </td>

    <td class="actions">
        <a th:href="@{'/admin/bookings/approve/' + ${b.id}}" class="btn approve">Approve</a>
        <a th:href="@{'/admin/bookings/cancel/' + ${b.id}}" class="btn cancel">Cancel</a>
        <a th:href="@{'/admin/bookings/delete/' + ${b.id}}" class="btn delete">Delete</a>
    </td>

</tr>

</tbody>
</table>

<h2 style="margin-top:50px;">Refund Requests</h2>

<div class="table-box">
<table>

<thead>
<tr>
<th>ID</th>
<th>User</th>
<th>Room</th>
<th>Reason</th>
<th>Amount</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr th:if="${refundRequests == null || #lists.isEmpty(refundRequests)}">
<td colspan="6" class="empty">No refund requests</td>
</tr>

<tr th:each="b : ${refundRequests}">

<td th:text="${b.id}"></td>

<td th:text="${b.user.name}"></td>

<td th:text="${b.room.type}"></td>

<td th:text="${b.refundReason}"></td>

<td>₹ <span th:text="${b.totalPrice}"></span></td>

<td class="actions">
<a th:href="@{'/admin/refund/approve/' + ${b.id}}" class="btn approve">Approve</a>
<a th:href="@{'/admin/refund/reject/' + ${b.id}}" class="btn delete">Reject</a>
</td>

</tr>

</tbody>
</table>
</div>
</div>

</div>

<div th:replace="~{admin/fragments :: footer}"></div>

</body>
</html>
