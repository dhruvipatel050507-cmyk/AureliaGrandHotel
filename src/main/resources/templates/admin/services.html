<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Manage Services</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body { margin:0; font-family:'Inter',sans-serif; background:#F4F6F9; }
.container { padding:30px; }

h2 { margin-bottom:20px; }

/* FORM */
.form-box {
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    display:grid;
    gap:10px;
}

input, select {
    padding:10px;
    border-radius:6px;
    border:1px solid #ddd;
}

/* BUTTONS */
.btn { padding:6px 12px; border:none; border-radius:6px; cursor:pointer; }
.btn-primary { background:#2E4F4F; color:white; }
.btn-danger { background:#e74c3c; color:white; }
.btn-edit { background:#3498db; color:white; }
.btn-save { background:#27ae60; color:white; }

/* SEARCH */
.search {
    width:300px;
    margin-bottom:20px;
}

/* GRID */
.service-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.service-card {
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.05);
}

.status {
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

.available { background:#d4edda; color:#2e7d32; }
.unavailable { background:#f8d7da; color:#c0392b; }

.edit-form { display:none; margin-top:10px; }
</style>
</head>

<body>

<div th:replace="admin/fragments :: navbar"></div>

<div class="container">

<h2>Manage Services</h2>

<!-- ➕ ADD SERVICE -->
<div class="form-box">
	<form action="/admin/add-service" 
	      method="post"
	      enctype="multipart/form-data">

	    <input type="text" name="name" placeholder="Service Name" required>

	    <input type="number" name="price" placeholder="Price" required>

	    <select name="status">
	        <option value="AVAILABLE">Available</option>
	        <option value="NOT_AVAILABLE">Not Available</option>
	    </select>

	    <!-- ✅ FIXED NAME (IMPORTANT) -->
	    <input type="file" name="file" required>

	    <button class="btn btn-primary">Add Service</button>

	</form>
	</div>

<!-- 🔍 SEARCH -->
<input type="text" class="search" placeholder="Search services..." onkeyup="searchService()">

<!-- 🛎 SERVICE CARDS -->
<div class="service-grid" id="serviceList">

<div class="service-card" th:each="s : ${services}">

<!-- VIEW MODE -->
<div class="view-mode">

	<img th:src="@{'/uploads/services/' + ${s.image}}"
	     style="width:100%; height:150px; object-fit:cover; border-radius:10px;"
	     onerror="this.src='/images/services/default.jpg'">
<h3 th:text="${s.name}"></h3>
<p>₹<span th:text="${s.price}"></span></p>

<p>
<span th:text="${s.status}" 
      th:classappend="${s.status == 'AVAILABLE'} ? 'status available' : 'status unavailable'">
</span>
</p>

<button class="btn btn-edit" onclick="toggleEdit(this)">Edit</button>

<a th:href="@{'/admin/services/delete/' + ${s.id}}" 
   class="btn btn-danger">Delete</a>

</div>

<!-- ✏️ EDIT MODE -->
<div class="edit-form">

	<form action="/admin/services/update"
	      method="post"
	      enctype="multipart/form-data">

	<input type="hidden" name="id" th:value="${s.id}">

	<input type="text" name="name" th:value="${s.name}">
	<input type="number" name="price" th:value="${s.price}">

	<select name="status">
	<option th:selected="${s.status == 'AVAILABLE'}">AVAILABLE</option>
	<option th:selected="${s.status == 'NOT_AVAILABLE'}">NOT_AVAILABLE</option>
	</select>

	<!-- ✅ NEW IMAGE UPLOAD -->
	<input type="file" name="imageFile">

	<button class="btn btn-save">Save</button>
	<button type="button" class="btn" onclick="toggleEdit(this)">Cancel</button>

	</form>
</div>

</div>

</div>

</div>

<div th:replace="admin/fragments :: footer"></div>

<script>
function searchService(){
    let input = document.querySelector(".search").value.toLowerCase();
    document.querySelectorAll(".service-card").forEach(card=>{
        card.style.display = card.innerText.toLowerCase().includes(input) ? "" : "none";
    });
}

function toggleEdit(btn){
    let card = btn.closest(".service-card");
    let view = card.querySelector(".view-mode");
    let edit = card.querySelector(".edit-form");

    if(edit.style.display === "block"){
        edit.style.display = "none";
        view.style.display = "block";
    } else {
        edit.style.display = "block";
        view.style.display = "none";
    }
}
</script>

</body>
</html>
